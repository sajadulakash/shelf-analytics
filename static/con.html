<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfAnalytics | Confidence</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --line: #ded7cc;
      --text: #211914;
      --muted: #74685e;
      --accent: #1d7d74;
      --danger: #b84141;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    .muted {
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(52, 42, 32, 0.08);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      font: inherit;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 0.92rem;
    }

    th {
      background: #f3eee6;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .confidence {
      font-weight: 700;
      white-space: nowrap;
    }

    .known {
      color: var(--accent);
      font-weight: 700;
    }

    .unknown {
      color: var(--danger);
      font-weight: 700;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      table { display: block; overflow-x: auto; }
      th, td { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Confidence Values</h1>
        <p class="muted" id="thresholdText">Loading confidence threshold...</p>
      </div>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label>
          Recent records
          <select id="limitSelect">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </label>
        <button id="refreshBtn" type="button">Refresh</button>
        <p class="muted" id="statusText"></p>
      </div>

      <div id="tableWrap"></div>
    </section>
  </main>

  <script>
    const thresholdText = document.getElementById("thresholdText");
    const statusText = document.getElementById("statusText");
    const tableWrap = document.getElementById("tableWrap");
    const limitSelect = document.getElementById("limitSelect");
    const refreshBtn = document.getElementById("refreshBtn");

    refreshBtn.addEventListener("click", loadConfidence);
    limitSelect.addEventListener("change", loadConfidence);
    loadConfidence();

    async function loadConfidence() {
      refreshBtn.disabled = true;
      statusText.textContent = "Loading...";

      try {
        const response = await fetch("/api/confidence?limit=" + encodeURIComponent(limitSelect.value));
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || data.error || "Failed to load confidence records.");
        }

        thresholdText.textContent = "Current unknown threshold: below " + Math.round(data.threshold * 100) + "% confidence is treated as Unknown.";
        renderTable(data.records || []);
        statusText.textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (error) {
        tableWrap.innerHTML = '<div class="empty">' + esc(error.message || "Failed to load confidence records.") + '</div>';
        statusText.textContent = "";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function renderTable(records) {
      if (records.length === 0) {
        tableWrap.innerHTML = '<div class="empty">No confidence records found yet.</div>';
        return;
      }

      const rows = records.map((item) => {
        const confidence = Number(item.confidence || 0);
        const statusClass = item.is_unknown ? "unknown" : "known";
        const statusText = item.is_unknown ? "Unknown" : "Known";
        return (
          "<tr>" +
            "<td>" + esc(item.filename || "") + "</td>" +
            "<td>" + esc(item.predicted_label || "Unknown") + "</td>" +
            '<td class="confidence">' + esc((confidence * 100).toFixed(2) + "%") + "</td>" +
            '<td class="' + statusClass + '">' + statusText + "</td>" +
            "<td>" + esc(item.reason || "") + "</td>" +
          "</tr>"
        );
      }).join("");

      tableWrap.innerHTML =
        "<table>" +
          "<thead>" +
            "<tr>" +
              "<th>File</th>" +
              "<th>Prediction</th>" +
              "<th>Confidence</th>" +
              "<th>Status</th>" +
              "<th>Reason</th>" +
            "</tr>" +
          "</thead>" +
          "<tbody>" + rows + "</tbody>" +
        "</table>";
    }

    function esc(value) {
      const div = document.createElement("div");
      div.textContent = String(value);
      return div.innerHTML;
    }
  </script>
</body>
</html>
