<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfAnalytics | Model Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/labels.css?v=3">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="process.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>ShelfAnalytics</strong>
          <span>Model configuration</span>
        </span>
      </a>
      <nav class="top-links">
        <a class="top-link" href="process.html">Explore Process</a>
        <a class="top-link active" aria-current="page" href="labels.html">Model Configuration</a>
        <a class="top-link" href="data-dump.html">Database Data Dump</a>
      </nav>
    </header>

    <section class="card">
      <div class="card-head">
        <h1>Model Configuration</h1>
        <p class="sub">Choose the models the pipeline runs.</p>
      </div>

      <div class="config-grid">
        <div class="field">
          <label class="field-label" for="yoloSelect">Detection · YOLO</label>
          <div class="select-wrap">
            <select id="yoloSelect">
              <option>best.pt</option>
              <option>best_v2.pt</option>
              <option>yolo26m_sahi.pt</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="swinSelect">Classification · SwinV2</label>
          <div class="select-wrap">
            <select id="swinSelect">
              <option>swinv2_model</option>
              <option>swinv2_v2</option>
              <option>swinv2_54cls</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="sahiSelect">Detection mode</label>
          <div class="select-wrap">
            <select id="sahiSelect">
              <option>With SAHI (sliced)</option>
              <option>Without SAHI (full frame)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn" id="saveBtn" type="button">Save configuration</button>
        <span class="status" id="status"></span>
      </div>

      <p class="hint">Preview only &mdash; simulated, no backend yet.</p>
    </section>
  </div>

  <script src="assets/js/model-config.js?v=3"></script>
</body>
</html>
