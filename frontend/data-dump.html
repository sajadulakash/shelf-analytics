<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfAnalytics | Database Data Dump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/labels.css?v=3">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="process.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>ShelfAnalytics</strong>
          <span>Database data dump</span>
        </span>
      </a>
      <nav class="top-links">
        <a class="top-link" href="process.html">Explore Process</a>
        <a class="top-link" href="labels.html">Model Configuration</a>
        <a class="top-link active" aria-current="page" href="data-dump.html">Database Data Dump</a>
      </nav>
    </header>

    <section class="card">
      <div class="card-head">
        <h1>Database Data Dump</h1>
        <p class="sub">CSV of <code>image_id, url</code> &rarr; detect, classify, dump to Postgres.</p>
      </div>

      <div class="upload-row">
        <label class="upload-box">
          <input type="file" id="csvInput" accept=".csv">
          Select CSV
        </label>
        <span class="file-name" id="fileName">No file chosen</span>
        <button class="btn" id="runBtn" type="button" disabled>Run &amp; Dump</button>
      </div>

      <div class="process" id="process">
        <div class="progress-head">
          <span class="label" id="phase">Starting…</span>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="progress"><div class="progress-bar" id="bar"></div></div>
        <ol class="steps" id="steps"></ol>
        <div class="result" id="result"><span class="tick">&#10003;</span><span id="resultText"></span></div>
      </div>

      <p class="hint">Preview only &mdash; simulated, no backend yet.</p>
    </section>
  </div>

  <script src="assets/js/data-dump.js?v=3"></script>
</body>
</html>
