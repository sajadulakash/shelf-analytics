<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShelfAnalytics | Confidence</title>
  <link rel="stylesheet" href="assets/css/con.css">
  <script src="assets/js/config.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Confidence Values</h1>
        <p class="muted" id="thresholdText">Loading confidence threshold...</p>
      </div>
    </header>

    <section class="panel">
      <div class="toolbar">
        <label>
          Recent records
          <select id="limitSelect">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </label>
        <button id="refreshBtn" type="button">Refresh</button>
        <p class="muted" id="statusText"></p>
      </div>

      <div id="tableWrap"></div>
    </section>
  </main>

  <script src="assets/js/con.js"></script>
</body>
</html>
